<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Overlay Moderno</title>

<style>
body {
    margin: 0;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #ffffff;
}

/* CONTAINER */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 18px;

    /* efeito vidro moderno */
    backdrop-filter: blur(10px);
}

/* HORA */
.hora {
    font-size: 48px;
    font-weight: 600;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(0,0,0,0.6);
}

/* CLIMA */
.clima {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    font-size: 20px;
    opacity: 0.9;
}

.clima img {
    width: 38px;
    height: 38px;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
}
</style>

</head>
<body>

<div class="container">
    <div class="hora" id="hora">--:--</div>

    <div class="clima">
        <img id="icone" src="">
        <span id="temp">--°C</span>
    </div>
</div>

<script>
// ===== HORA =====
function atualizarHora() {
    const agora = new Date();
    const h = String(agora.getHours()).padStart(2, '0');
    const m = String(agora.getMinutes()).padStart(2, '0');
    document.getElementById("hora").innerText = `${h}:${m}`;
}
setInterval(atualizarHora, 1000);
atualizarHora();

// ===== CLIMA (LEME - SP) =====
async function carregarClima() {
    try {
        const lat = -22.18;
        const lon = -47.39;

        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await res.json();

        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;

        document.getElementById("temp").innerText = `${temp}°C`;

        let icon = "01d";

        if (code === 0) icon = "01d";
        else if ([1,2,3].includes(code)) icon = "02d";
        else if ([45,48].includes(code)) icon = "50d";
        else if ([51,53,55,61,63,65].includes(code)) icon = "10d";
        else if ([71,73,75].includes(code)) icon = "13d";
        else if ([95,96,99].includes(code)) icon = "11d";

        document.getElementById("icone").src =
            `https://openweathermap.org/img/wn/${icon}@2x.png`;

    } catch (e) {
        console.log("Erro clima:", e);
    }
}

carregarClima();
setInterval(carregarClima, 600000);
</script>

</body>
</html>
